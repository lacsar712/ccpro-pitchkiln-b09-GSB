{% extends "base.html" %}
{% block title %}来脂批{% endblock %}
{% block content %}
<section class="feed-head">
  <div>
    <h1>来脂批</h1>
    <p class="board-sub">到货时间线 · 产地精确筛 · 三路对照</p>
  </div>
  <a class="back-link" href="{% url 'home' %}">← 回值守看板</a>
</section>

<div class="feed-layout">
  <div class="feed-side">
    <form method="post" class="lot-intake stack-form">
      {% csrf_token %}
      <h2>登记到货</h2>
      {{ form.as_p }}
      <button type="submit" class="btn-ember">写入来脂批</button>
    </form>

    <form method="get" action="{% url 'resin_lot_feed' %}" class="lot-filter stack-form"
          hx-get="{% url 'resin_lot_feed' %}"
          hx-target="#lot-results"
          hx-swap="outerHTML"
          hx-push-url="true"
          hx-trigger="change, submit">
      <h2>产地精确筛</h2>
      <p>
        <label for="origin-select">产地（与来源地全等）</label>
        <select id="origin-select" name="origin" class="field">
          <option value="" {% if not origin %}selected{% endif %}>全部产地</option>
          {% for o in origins %}
          <option value="{{ o }}" {% if o == origin %}selected{% endif %}>{{ o }}</option>
          {% endfor %}
        </select>
      </p>
      <button type="submit" class="btn-ghost">按产地筛选</button>
    </form>
  </div>

  {% include "resin/_feed_results.html" %}
</div>
{% endblock %}
