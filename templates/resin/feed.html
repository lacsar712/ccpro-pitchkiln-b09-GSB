{% extends "base.html" %}
{% block title %}来脂批{% endblock %}
{% block content %}
<section class="feed-head">
  <div>
    <h1>来脂批</h1>
    <p class="board-sub">到货时间线 · 产地精确筛 · 三路对照</p>
  </div>
  <a class="back-link" href="{% url 'home' %}">← 回值守看板</a>
</section>

<form class="origin-filter" method="get" action="{% url 'resin_lot_feed' %}">
  <label for="origin-filter">产地精确筛</label>
  <select id="origin-filter" name="origin" class="field"
          hx-get="{% url 'resin_lot_feed' %}"
          hx-trigger="change"
          hx-target="#lot-results"
          hx-swap="outerHTML"
          hx-push-url="true">
    <option value="">全部产地</option>
    {% for o in origin_options %}
    <option value="{{ o }}" {% if o == origin %}selected{% endif %}>{{ o }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="btn-ghost">筛选</button></noscript>
</form>

<div class="feed-layout">
  <form method="post" class="lot-intake stack-form">
    {% csrf_token %}
    <h2>登记到货</h2>
    {{ form.as_p }}
    <button type="submit" class="btn-ember">写入来脂批</button>
  </form>

  {% include "resin/_feed_results.html" %}
</div>
{% endblock %}
